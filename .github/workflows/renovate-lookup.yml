name: Renovate lookup
on: workflow_dispatch
permissions:
  contents: read
jobs:
  lookup:
    # GitHub-hosted runner: whether its IP address is on the allow list of the
    # organizations which own the actions in `example.yml` varies by runner,
    # so the job runs several times.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check access with an authenticated request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Runner IP: $(curl -s https://api.ipify.org)"
            echo '| Request | Authenticated | IP allow list refusal |'
            echo '| :-- | :-- | :-- |'
            for repo in aquasecurity/setup-trivy aquasecurity/trivy-action bridgecrewio/checkov-action; do
              owner=${repo%/*}; name=${repo#*/}
              code=$(curl -s -o rest.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$repo/tags?per_page=1")
              echo "| REST \`$repo\` | $code | $(grep -qs 'IP allow list' rest.json && echo YES || echo no) |"
              query=$(printf '{"query":"query{repository(owner:\\"%s\\",name:\\"%s\\"){refs(refPrefix:\\"refs/tags/\\",first:1){totalCount}}}"}' "$owner" "$name")
              code=$(curl -s -o gql.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -d "$query" https://api.github.com/graphql)
              echo "| GraphQL \`$repo\` | $code | $(grep -qs 'IP allow list' gql.json && echo YES || echo no) |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run released Renovate without changing anything
        env:
          RENOVATE_PLATFORM: local
          RENOVATE_GITHUB_COM_TOKEN: ${{ github.token }}
          LOG_LEVEL: debug
        run: npx --yes renovate 2>&1 | tee released.log
      # Same job, so the same runner IP address as the released Renovate above.
      - uses: actions/checkout@v6
        with:
          repository: dm3ch/renovate
          # https://github.com/renovatebot/renovate/pull/48249
          ref: 85d007b2d4b42c0f724f00452efe26330b34760b
          path: ${{ runner.temp }}/renovate-fix
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Run Renovate with the fix without changing anything
        env:
          RENOVATE_PLATFORM: local
          RENOVATE_GITHUB_COM_TOKEN: ${{ github.token }}
          LOG_LEVEL: debug
        run: |
          corepack enable
          (cd "$RUNNER_TEMP/renovate-fix" && pnpm install --frozen-lockfile >/dev/null)
          node "$RUNNER_TEMP/renovate-fix/lib/renovate.ts" 2>&1 | tee fixed.log
      - name: Show lookup results
        if: always()
        run: |
          {
            echo '### Result of the lookup of `aquasecurity/setup-trivy`'
            echo '| Renovate | Version | Update found | Lookup failures |'
            echo '| :-- | :-- | :-- | :-- |'
            for kind in released fixed; do
              version=$(grep -m1 -o '"renovateVersion": *"[^"]*"' $kind.log | cut -d'"' -f4)
              found=$(grep -c '"newValue": "v0.3.1"' $kind.log || true)
              failed=$(grep -c 'Failed to look up' $kind.log || true)
              echo "| $kind | $version | $([ "$found" -gt 0 ] && echo yes || echo NO) | $failed |"
            done
          } >> "$GITHUB_STEP_SUMMARY"
