name: Renovate lookup
on: workflow_dispatch
permissions:
  contents: read
jobs:
  lookup:
    # GitHub-hosted runner: whether its IP address is on the allow list of the
    # organizations which own the actions in `example.yml` varies by runner,
    # so the job runs several times.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Check access with an authenticated request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "### Runner IP: $(curl -s https://api.ipify.org)"
            echo '| Request | Authenticated | IP allow list refusal |'
            echo '| :-- | :-- | :-- |'
            for repo in aquasecurity/setup-trivy aquasecurity/trivy-action bridgecrewio/checkov-action; do
              owner=${repo%/*}; name=${repo#*/}
              code=$(curl -s -o rest.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$repo/tags?per_page=1")
              echo "| REST \`$repo\` | $code | $(grep -qs 'IP allow list' rest.json && echo YES || echo no) |"
              query=$(printf '{"query":"query{repository(owner:\\"%s\\",name:\\"%s\\"){refs(refPrefix:\\"refs/tags/\\",first:1){totalCount}}}"}' "$owner" "$name")
              code=$(curl -s -o gql.json -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" -d "$query" https://api.github.com/graphql)
              echo "| GraphQL \`$repo\` | $code | $(grep -qs 'IP allow list' gql.json && echo YES || echo no) |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Run released Renovate without changing anything
        env:
          RENOVATE_PLATFORM: local
          RENOVATE_GITHUB_COM_TOKEN: ${{ github.token }}
          LOG_LEVEL: debug
        run: npx --yes renovate 2>&1 | tee released.log
      # Same job, so the same runner IP address as the released Renovate above.
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Outside the workspace, so Renovate does not scan its own workflow files.
      - name: Fetch and install the Renovate fixes
        run: |
          corepack enable
          # https://github.com/renovatebot/renovate/pull/48249
          # before: REST without a token after GraphQL is refused
          # after: also skips GraphQL for an organization which already refused the token
          for build in before:5f302ec08db1bb64c5317ddf81b39591e28cadda after:bce9f00a1bd5337dd9e82aa81c67bff09f324667; do
            name=${build%%:*}
            sha=${build#*:}
            dir="$RUNNER_TEMP/renovate-$name"
            git init -q "$dir"
            git -C "$dir" fetch -q --depth 1 https://github.com/dm3ch/renovate.git "$sha"
            git -C "$dir" checkout -q FETCH_HEAD
            (cd "$dir" && pnpm install --frozen-lockfile >/dev/null)
          done
      - name: Run Renovate before the skip without changing anything
        env:
          RENOVATE_PLATFORM: local
          RENOVATE_GITHUB_COM_TOKEN: ${{ github.token }}
          LOG_LEVEL: debug
        run: node "$RUNNER_TEMP/renovate-before/lib/renovate.ts" 2>&1 | tee before.log
      - name: Run Renovate after the skip without changing anything
        env:
          RENOVATE_PLATFORM: local
          RENOVATE_GITHUB_COM_TOKEN: ${{ github.token }}
          LOG_LEVEL: debug
        run: node "$RUNNER_TEMP/renovate-after/lib/renovate.ts" 2>&1 | tee after.log
      - name: Show lookup results
        if: always()
        run: |
          {
            echo '### Lookups of `aquasecurity/setup-trivy` and `aquasecurity/trivy-action`'
            echo '| Renovate | Updates found | Lookup failures | Requests to api.github.com |'
            echo '| :-- | :-- | :-- | :-- |'
            for kind in released before after; do
              found=$(grep -cE '"newValue": "v0\.3\.1"|"newValue": "v0\.36\.0"' $kind.log || true)
              failed=$(grep -c 'Failed to look up' $kind.log || true)
              requests=$(grep -A1 '"api.github.com": {' $kind.log | grep -m1 -o '"count": [0-9]*' | grep -o '[0-9]*')
              echo "| $kind | $found of 2 | $failed | $requests |"
            done
          } | tee -a "$GITHUB_STEP_SUMMARY"
