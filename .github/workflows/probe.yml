name: Probe
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Authenticated read of public repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "runner ip: $(curl -s https://api.ipify.org)"
          for r in aquasecurity/setup-trivy aquasecurity/trivy-action aquasecurity/trivy bridgecrewio/checkov-action cloudpilot-ai/karpenter-provider-gcp; do
            code=$(curl -s -o /tmp/o -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/$r/tags?per_page=1")
            echo "$r authenticated=$code $(grep -o 'IP allow list' /tmp/o | head -1)"
          done
